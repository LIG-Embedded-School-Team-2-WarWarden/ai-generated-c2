name: Visual Studio binary ICD
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild ai-generated-c2.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m
      - shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release
