name: Native device integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Keep private C2 source in its own repository's runner.
      - uses: actions/checkout@v4
        with:
          repository: LIG-Embedded-School-Team-2-WarWarden/firmware
          ref: b490acc693ef965d36be809f24f0ea2479ea7e93
          submodules: recursive
          path: device-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler
      - run: python -m pip install -r requirements-team.txt
      - run: cmake -S . -B build -DC2_BUILD_LIVE=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --output-log build/c2-results.txt
      - run: cmake -S device-source -B device-build -DLIDAR_WITH_XTSDK=OFF
      - run: cmake --build device-build --parallel 2
      - run: ctest --test-dir device-build --output-on-failure --output-log build/device-results.txt
      - name: Raw capture, continuous aim, STOP and real UART backend with PTY
        run: python device-source/tests/test_c2_link.py --obs device-build/mfs_obs --eff device-build/mfs_eff --c2-root . --detector build/c2_detector_worker 2>&1 | tee build/native-integration-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-validation
          path: |
            build/c2-results.txt
            build/device-results.txt
            build/native-integration-results.txt
