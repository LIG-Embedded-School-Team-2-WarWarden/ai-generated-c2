name: Native C2 integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler nlohmann-json3-dev
      - run: python -m pip install -r requirements-team.txt
      - run: cmake -S . -B build -DC2_BUILD_LIVE=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --output-log build/c2-results.txt
      - uses: actions/checkout@v4
        with:
          repository: LIG-Embedded-School-Team-2-WarWarden/firmware
          ref: 93f8edc2276824e349fc5e4488e6c0ae9c55fc8e
          submodules: recursive
          path: firmware-integration
      - run: cmake -S firmware-integration -B build/firmware -DLIDAR_WITH_XTSDK=OFF
      - run: cmake --build build/firmware --parallel 2
      - name: Native C2 and firmware laser integration
        run: python firmware-integration/tests/test_laser.py --eff build/firmware/mfs_eff --obs build/firmware/mfs_obs --console build/c2_mvp_console --config configs/team-demo.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-c2-validation
          path: |
            build/c2-results.txt
            build/Testing/Temporary/LastTest.log
